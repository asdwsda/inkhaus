# M5Paper HA remote: example secrets (all values are fake).
#
# Copy this file to the ROOT of the SD card and name it `secrets.yaml`
# (or send it with tools/provision.py --name secrets.yaml FILE).
# The real secrets.yaml holds the Wi-Fi password and the HA token: it is gitignored, never commit it.
# Layout: the dashboard (tabs, widgets, groups) is in config.yaml, see config.example.yaml.

# `wifi:` is a list of profiles (up to 4, in priority order). Auto picks the first one in range.
# A single mapping (ssid/password/...) instead of a list is still accepted.
#   name:      shown in Settings (optional, max 20 chars, unique)
#   ha_url:    internal | external | auto (optional, default auto; external needs external_url below).
#              auto: the device learns per network which HA URL works and keeps using it there.
#   static_ip: optional; if present, all four fields are required
wifi:
  - name: Home
    ssid: "MyWifi"
    password: "secret"
    ha_url: internal
    static_ip:
      ip: 192.168.1.50
      gateway: 192.168.1.1
      subnet: 255.255.255.0
      dns: 192.168.1.1
  - name: Phone hotspot
    ssid: "MyPhone"
    password: "secret2"
    ha_url: external

home_assistant:
  internal_url: http://192.168.1.10:8123
  external_url: https://example.ui.nabu.casa   # optional, must be https
  token: "long-lived-token"
