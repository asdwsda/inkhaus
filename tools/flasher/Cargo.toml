[package]
name = "flasher"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
hex = "0.4.3"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10", default-features = false }
sha2 = "0.11.1"
tempfile = "3.27.0"
ureq = "3"
zip = "9.1.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
