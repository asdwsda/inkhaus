<text id="fx-c1" x="20" y="372" font-size="18" fill="#000" text-anchor="start" >Dotted frame, grey name, "n/a": Home Assistant</text>
<text id="fx-c2" x="20" y="396" font-size="18" fill="#000" text-anchor="start" >says the entity is unavailable. Taps are ignored.</text>
<text id="fx-c3" x="20" y="426" font-size="18" fill="#444" text-anchor="start" >"-" instead: no value yet, press "updated".</text>
<text id="fx-do" x="620" y="88" font-size="18" fill="#444" text-anchor="start" >What to do</text>
<text id="fx-d0" x="620" y="120" font-size="18" fill="#000" text-anchor="start" >1. Open the device in Home Assistant:</text>
<text id="fx-d1" x="656" y="148" font-size="18" fill="#000" text-anchor="start" >is it online?</text>
<text id="fx-d2" x="620" y="176" font-size="18" fill="#000" text-anchor="start" >2. Compare the entity id with Settings</text>
<text id="fx-d3" x="656" y="204" font-size="18" fill="#000" text-anchor="start" >> Devices &amp; services > Entities.</text>
<text id="fx-d4" x="656" y="232" font-size="18" fill="#000" text-anchor="start" >Copy it exactly, lowercase.</text>
<text id="fx-d5" x="620" y="260" font-size="18" fill="#000" text-anchor="start" >3. When the entity is back, the next</text>
<text id="fx-d6" x="656" y="288" font-size="18" fill="#000" text-anchor="start" >update clears the frame.</text>
</svg>
