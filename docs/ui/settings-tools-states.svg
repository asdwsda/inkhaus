<rect width="1652" height="1532" fill="#fff"/>
<text x="16" y="24" font-size="24" font-weight="bold" fill="#000" text-anchor="start" dominant-baseline="central">Tools page: firmware row, install and update states (task 087)</text>
<text x="16" y="58" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Up to date (info look: hairline, not tappable)</text>
<g id="w-1">
<rect id="w-1-frame" x="16" y="74" width="508" height="88" rx="8" fill="#fff"/>
<rect x="16" y="74" width="508" height="1" fill="#888"/>
<text id="w-1-label" x="32" y="106" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Firmware</text>
<text id="w-1-hint" x="32" y="136" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Up to date, checked 26.10.</text>
<text id="w-1-value" x="508" y="118" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">1.2.1</text>
</g>
<text x="16" y="182" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Update available (solid border, NEW chip)</text>
