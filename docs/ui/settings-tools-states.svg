<text id="w-2-chiptext" x="196" y="230" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">NEW</text>
<text id="w-2-hint" x="32" y="260" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Update to 1.3.0 available</text>
<text id="w-2-value" x="508" y="242" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">1.2.1</text>
</g>
<text x="16" y="306" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Refused: battery &lt; 50 % and not on USB (dotted)</text>
