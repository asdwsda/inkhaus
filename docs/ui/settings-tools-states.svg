<rect id="w-3-frame" x="16" y="322" width="508" height="88" rx="8" fill="#fff"/>
<rect x="17" y="323" width="506" height="86" rx="8" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="2 4"/>
<text id="w-3-label" x="32" y="354" font-size="24" fill="#888" text-anchor="start" dominant-baseline="central">Firmware</text>
<rect id="w-3-chip" x="160" y="338" width="72" height="32" rx="8" fill="#000"/>
<text id="w-3-chiptext" x="196" y="354" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">NEW</text>
<text id="w-3-hint" x="32" y="384" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">1.3.0 needs USB or 50% battery</text>
<text id="w-3-value" x="508" y="366" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">1.2.1</text>
</g>
<text x="16" y="430" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Refused: Wi-Fi not connected (dotted)</text>
