<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans">
  <!-- Sleep and wake page, landscape. Spec: settings.md section 8.2. Shown: wake Touch (note visible), focus on Refresh every. Widgets: w-1..w-3 rows, w-4 note, w-5 Back. -->
  <defs>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="6.5" x2="12" y2="13.5" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1 -2.1 -5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="20,3 20,10 13,10" fill="currentColor"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><polyline points="9,4 17,12 9,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
<text x="16" y="25" font-size="40" fill="#000" text-anchor="start" dominant-baseline="central">Sleep &amp; wake</text>
<rect x="824" y="9" width="120" height="32" rx="8" fill="#000"/>
<text x="884" y="25" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">unsaved</text>
<rect x="0" y="50" width="960" height="2" fill="#000"/>
<g id="w-1">
<rect id="w-1-frame" x="16" y="64" width="456" height="68" rx="8" fill="#fff"/>
<rect x="17" y="65" width="454" height="66" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-1-label" x="32" y="88" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Wake mode</text>
<circle id="w-1-pip0" cx="38" cy="111" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-1-pip1" cx="58" cy="111" r="6" fill="#000"/>
<circle id="w-1-pip2" cx="78" cy="111" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text id="w-1-value" x="456" y="98" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Touch</text>
</g>
<rect x="11.5" y="139.5" width="465" height="77" rx="12.5" fill="none" stroke="#000" stroke-width="3"/>
<g id="w-2">
<rect id="w-2-frame" x="16" y="144" width="456" height="68" rx="8" fill="#fff"/>
<rect x="17" y="145" width="454" height="66" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-2-label" x="32" y="168" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Refresh every</text>
<circle id="w-2-pip0" cx="38" cy="191" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip1" cx="58" cy="191" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip2" cx="78" cy="191" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip3" cx="98" cy="191" r="6" fill="#000"/>
<circle id="w-2-pip4" cx="118" cy="191" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip5" cx="138" cy="191" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text id="w-2-value" x="456" y="178" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">60 min</text>
</g>
<g id="w-3">
<rect id="w-3-frame" x="16" y="224" width="456" height="68" rx="8" fill="#fff"/>
<rect x="17" y="225" width="454" height="66" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-3-label" x="32" y="248" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Idle timeout</text>
<circle id="w-3-pip0" cx="38" cy="271" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-3-pip1" cx="58" cy="271" r="6" fill="#000"/>
<circle id="w-3-pip2" cx="78" cy="271" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-3-pip3" cx="98" cy="271" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text id="w-3-value" x="456" y="258" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">20 s</text>
</g>
<g id="w-4">
<rect id="w-4-frame" x="16" y="304" width="456" height="64" rx="8" fill="#fff"/>
<rect x="17" y="305" width="454" height="62" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<use id="w-4-icon" xlink:href="#i-alert" href="#i-alert" x="28" y="316" width="40" height="40" color="#000"/>
<text id="w-4-l1" x="80" y="325" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Touch wake shortens battery life.</text>
<text id="w-4-l2" x="80" y="347" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Button wake is recommended.</text>
</g>
<g id="w-5">
<rect id="w-5-frame" x="722" y="464" width="222" height="64" rx="8" fill="#fff"/>
<rect x="723" y="465" width="220" height="62" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<use id="w-5-icon" xlink:href="#i-chev-l" href="#i-chev-l" x="734" y="476" width="40" height="40" color="#000"/>
<text id="w-5-label" x="782" y="496" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Back</text>
</g>
</svg>
