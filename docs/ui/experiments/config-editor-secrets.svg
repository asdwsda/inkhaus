<rect x="169.0" y="718.0" width="20" height="20" rx="2" fill="#000" stroke="#000" stroke-width="2"/>
<text xml:space="preserve" id="w-3-t20" x="179" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">!</text>
<text xml:space="preserve" id="w-3-t21" x="202" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Must start with http:// or https://</text>
<text xml:space="preserve" id="w-3-t22" x="612" y="639" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Access token</text>
<rect x="613.5" y="650.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t23" x="632" y="684" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">••••••••••••••••••••••••</text>
<rect x="613.0" y="718.0" width="20" height="20" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
<text xml:space="preserve" id="w-3-t24" x="623" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#000" text-anchor="middle" font-weight="bold">?</text>
<text xml:space="preserve" id="w-3-t25" x="646" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Looks short. Tokens have over 100 characters.</text>
<rect x="169.5" y="766.5" width="25" height="25" rx="2" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t26" x="212" y="786" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Show characters</text>
<text xml:space="preserve" id="w-3-t27" x="168" y="825" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">More Wi-Fi networks, a fixed IP or an outside address: write secrets.yaml as a file</text>
<text xml:space="preserve" id="w-3-t28" x="168" y="849" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">(see docs/CONFIG.md), or paste a whole file instead.</text>
<rect x="169.5" y="874.5" width="317" height="53" rx="4" fill="#fff" stroke="#888" stroke-width="3" stroke-dasharray="6 4"/>
<text xml:space="preserve" id="w-3-t29" x="328.0" y="907" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Write secrets to device</text>
<rect x="513.5" y="874.5" width="237" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t30" x="632.0" y="907" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">Clear fields</text>
<text xml:space="preserve" id="w-3-t31" x="168" y="953" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Disabled until the required fields are valid. Fields are cleared after a successful write,</text>
<text xml:space="preserve" id="w-3-t32" x="168" y="977" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">and when you leave or reload this page.</text>
</g>
