<text xml:space="preserve" id="w-2-t7" x="144" y="222" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">The optional secrets step, opened.</text>
</g>
<g id="w-3"><rect id="w-3-frame" x="144" y="263" width="912" height="764" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-3-t8" x="168" y="313" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Optional: secrets.yaml (Wi-Fi and Home Assistant token)</text>
<rect x="168.5" y="333.5" width="863" height="149" rx="0" fill="#f2f2f2" stroke="#f2f2f2" stroke-width="1"/>
<rect x="168.5" y="333.5" width="5" height="149" rx="0" fill="#000" stroke="#000" stroke-width="1"/>
<text xml:space="preserve" id="w-3-t9" x="192" y="363" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" font-weight="bold">Your secrets stay in this browser</text>
<text xml:space="preserve" id="w-3-t10" x="192" y="387" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">This page does not store, send or log what you type here.</text>
<text xml:space="preserve" id="w-3-t11" x="192" y="411" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">It goes from this browser to the M5Paper over the USB cable, nowhere else.</text>
<text xml:space="preserve" id="w-3-t12" x="192" y="435" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Write-only: the device never sends secrets back, so these fields start empty.</text>
<text xml:space="preserve" id="w-3-t13" x="192" y="459" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Writing replaces the whole secrets.yaml on the device, all Wi-Fi networks included.</text>
<text xml:space="preserve" id="w-3-t14" x="168" y="519" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Wi-Fi name (SSID)</text>
<rect x="169.5" y="530.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t15" x="188" y="564" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">MyWifi</text>
<text xml:space="preserve" id="w-3-t16" x="612" y="519" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Wi-Fi password</text>
<rect x="613.5" y="530.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t17" x="632" y="564" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">••••••••••</text>
<text xml:space="preserve" id="w-3-t18" x="168" y="639" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Home Assistant address</text>
<rect x="169.5" y="650.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<rect x="171.5" y="652.5" width="5" height="49" rx="0" fill="#000" stroke="#000" stroke-width="1"/>
