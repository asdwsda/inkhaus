<rect id="w-5-frame" x="4" y="588" width="532" height="132" fill="none"/>
<text id="w-5-cap" x="16" y="611" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Next event</text>
<text id="w-5-time" x="16" y="654" font-size="40" fill="#000" text-anchor="start" dominant-baseline="central">16:30</text>
<text id="w-5-title" x="148" y="654" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Dentist appointment</text>
<text id="w-5-day" x="16" y="694" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Today</text>
</g>
<rect x="16" y="720" width="508" height="1" fill="#888"/>
<g id="w-6">
<rect id="w-6-frame" x="4" y="720" width="532" height="108" fill="none"/>
<text id="w-6-cap" x="16" y="743" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Notifications</text>
<text id="w-6-count" x="16" y="786" font-size="40" fill="#000" text-anchor="start" dominant-baseline="central">3</text>
<text id="w-6-title" x="60" y="786" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Water leak: kitchen sensor</text>
</g>
<rect x="16" y="876" width="508" height="1" fill="#888"/>
<g id="w-7">
<rect id="w-7-frame" x="4" y="880" width="532" height="80" fill="none"/>
<use id="w-7-icon" xlink:href="#i-moon" href="#i-moon" x="16" y="900" width="40" height="40" color="#000"/>
<text id="w-7-lbl" x="68" y="906" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Asleep</text>
<text id="w-7-hint" x="68" y="936" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Tap or press the side button</text>
