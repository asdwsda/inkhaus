<text xml:space="preserve" id="w-2-t8" x="24" y="260" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Connect your M5Paper with a USB</text>
<text xml:space="preserve" id="w-2-t9" x="24" y="287" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">cable and install Inkhaus here in</text>
<text xml:space="preserve" id="w-2-t10" x="24" y="314" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">the browser. No tools to download.</text>
<text xml:space="preserve" id="w-2-t11" x="24" y="341" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Your settings and SD card are kept</text>
<text xml:space="preserve" id="w-2-t12" x="24" y="368" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">when you update.</text>
</g>
<g id="w-3">
<rect id="w-3-frame" x="24" y="421" width="352" height="494" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-3-t13" x="48" y="471" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">1. Choose a version</text>
<rect x="49.5" y="490.5" width="301" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t14" x="64" y="523" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">1.2.0 latest, 2026-11-01</text>
<polygon id="w-3-i15" points="312,512 328,512 320,522" fill="#000"/>
<rect x="49.5" y="554.5" width="25" height="25" rx="2" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t16" x="92" y="575" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Show pre-releases</text>
<text xml:space="preserve" id="w-3-t17" x="48" y="635" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">2. Install</text>
<rect x="49.5" y="654.5" width="301" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t18" x="200.0" y="687.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">Install 1.2.0</text>
<text xml:space="preserve" id="w-3-t19" x="48" y="741" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">A browser window asks for the USB</text>
<text xml:space="preserve" id="w-3-t20" x="48" y="765" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">port: pick the new entry that appears</text>
<text xml:space="preserve" id="w-3-t21" x="48" y="789" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">when you plug in the M5Paper.</text>
<text xml:space="preserve" id="w-3-t22" x="48" y="813" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Your settings and SD card are kept.</text>
</g>
<g id="w-4">
<rect id="w-4-frame" x="0" y="963" width="400" height="746" rx="0" fill="none" stroke="none" stroke-width="1"/>
<line x1="0" y1="963" x2="400" y2="963" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t23" x="24" y="1027" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">Before you start</text>
<rect x="24.5" y="1051.5" width="351" height="189" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t24" x="40" y="1095" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">1</text>
<text xml:space="preserve" id="w-4-t25" x="40" y="1127" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Use a data cable</text>
<text xml:space="preserve" id="w-4-t26" x="40" y="1157" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Some USB cables only</text>
<text xml:space="preserve" id="w-4-t27" x="40" y="1184" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">charge. Use one that</text>
<text xml:space="preserve" id="w-4-t28" x="40" y="1211" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">also carries data.</text>
<rect x="24.5" y="1257.5" width="351" height="225" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t29" x="40" y="1301" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">2</text>
<text xml:space="preserve" id="w-4-t30" x="40" y="1333" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Windows: driver</text>
<text xml:space="preserve" id="w-4-t31" x="40" y="1363" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Windows may need the</text>
<text xml:space="preserve" id="w-4-t32" x="40" y="1390" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">CH9102 USB driver once.</text>
<text xml:space="preserve" id="w-4-t33" x="40" y="1417" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Mac and Linux do not.</text>
<text xml:space="preserve" id="w-4-t34" x="40" y="1452" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" text-decoration="underline">Get the CH9102 driver</text>
<rect x="24.5" y="1499.5" width="351" height="189" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t35" x="40" y="1543" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">3</text>
<text xml:space="preserve" id="w-4-t36" x="40" y="1575" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Pick the right browser</text>
<text xml:space="preserve" id="w-4-t37" x="40" y="1605" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Chrome, Edge or Opera</text>
<text xml:space="preserve" id="w-4-t38" x="40" y="1632" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">on a computer. Not</text>
<text xml:space="preserve" id="w-4-t39" x="40" y="1659" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Firefox or Safari.</text>
</g>
<g id="w-5">
<rect id="w-5-frame" x="0" y="1709" width="400" height="560" rx="0" fill="none" stroke="none" stroke-width="1"/>
<line x1="0" y1="1709" x2="400" y2="1709" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-5-t40" x="24" y="1773" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">After the install</text>
<text xml:space="preserve" id="w-5-t41" x="24" y="1813" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">The M5Paper restarts and asks</text>
<text xml:space="preserve" id="w-5-t42" x="24" y="1840" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">for its files. Copy these two</text>
<text xml:space="preserve" id="w-5-t43" x="24" y="1867" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">files to the root of its SD card</text>
<text xml:space="preserve" id="w-5-t44" x="24" y="1894" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">(FAT32) and restart it:</text>
<rect x="24.5" y="1931.5" width="351" height="107" rx="0" fill="#f2f2f2" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-5-t45" x="40" y="1961" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#000" text-anchor="start">config.yaml</text>
<text xml:space="preserve" id="w-5-t46" x="40" y="1985" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#000" text-anchor="start">  your tabs and widgets</text>
<text xml:space="preserve" id="w-5-t47" x="40" y="2009" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#000" text-anchor="start">secrets.yaml</text>
<text xml:space="preserve" id="w-5-t48" x="40" y="2033" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#000" text-anchor="start">  Wi-Fi and HA token</text>
<text xml:space="preserve" id="w-5-t49" x="24" y="2081" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">How to write them:</text>
<text xml:space="preserve" id="w-5-t50" x="24" y="2108" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">docs/CONFIG.md</text>
<text xml:space="preserve" id="w-5-t51" x="24" y="2165" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Firefox, Safari or offline?</text>
<text xml:space="preserve" id="w-5-t52" x="24" y="2192" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Use the installer apps.</text>
</g>
