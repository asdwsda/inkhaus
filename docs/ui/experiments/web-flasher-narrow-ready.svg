<text xml:space="preserve" id="w-1-t3" x="24" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">Features</text>
<text xml:space="preserve" id="w-1-t4" x="128" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">Install</text>
