<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans">
  <!-- Settings, landscape 960x540. Spec: docs/ui/settings.md section 4 (revision 3). Greys only: #000, #444, #888, #fff.
       State shown: nothing changed (no "unsaved" chip), wake mode = Button (note slot (16,464,456,64) empty), no focus ring, HA remote, config OK.
       Every <text> uses dominant-baseline="central": its y is the centre line. Icons are placed so that y + size/2 is the centre line. -->
  <defs>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1 -2.1 -5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="20,3 20,10 13,10" fill="currentColor"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#fff"/>

  <!-- Header (0,0,960,52): title cy 25, rule (0,50,960,2) -->
  <text x="16" y="25" font-size="40" fill="#000" dominant-baseline="central">Settings</text>
  <rect x="0" y="50" width="960" height="2" fill="#000"/>

  <!-- Row 1 Orientation (16,64,456,88): label cy 94, pips cy 126, value cy 108; Landscape, pip 1 of 2 -->
  <rect x="17" y="65" width="454" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="94" font-size="24" fill="#000" dominant-baseline="central">Orientation</text>
  <circle cx="38" cy="126" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="58" cy="126" r="6" fill="#000"/>
  <text x="456" y="108" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Landscape</text>

  <!-- Row 2 Wake mode (16,164,456,88): Button, pip 0 of 2 -->
  <rect x="17" y="165" width="454" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="194" font-size="24" fill="#000" dominant-baseline="central">Wake mode</text>
  <circle cx="38" cy="226" r="6" fill="#000"/>
  <circle cx="58" cy="226" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="456" y="208" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Button</text>

  <!-- Row 3 Refresh every (16,264,456,88): 30 min, pip 2 of 6 -->
  <rect x="17" y="265" width="454" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="294" font-size="24" fill="#000" dominant-baseline="central">Refresh every</text>
  <circle cx="38" cy="326" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="58" cy="326" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="78" cy="326" r="6" fill="#000"/>
  <circle cx="98" cy="326" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="118" cy="326" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="138" cy="326" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="456" y="308" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">30 min</text>

  <!-- Row 4 Idle timeout (16,364,456,88): 30 s, pip 2 of 4 -->
  <rect x="17" y="365" width="454" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="394" font-size="24" fill="#000" dominant-baseline="central">Idle timeout</text>
  <circle cx="38" cy="426" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="58" cy="426" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="78" cy="426" r="6" fill="#000"/>
  <circle cx="98" cy="426" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="456" y="408" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">30 s</text>

  <!-- Info rows, x=488, width 456: hairline on each top edge; label x=488 F18 DIM; value x=646 F24; cy = row y + h/2 -->
  <rect x="488" y="64" width="456" height="1" fill="#888"/>
  <text x="488" y="92" font-size="18" fill="#444" dominant-baseline="central">Firmware</text>
  <text x="646" y="92" font-size="24" fill="#000" dominant-baseline="central">v0.3.1</text>

  <rect x="488" y="120" width="456" height="1" fill="#888"/>
  <text x="488" y="148" font-size="18" fill="#444" dominant-baseline="central">Battery</text>
  <text x="646" y="148" font-size="24" fill="#000" dominant-baseline="central">78%, 3.92 V</text>

  <rect x="488" y="176" width="456" height="1" fill="#888"/>
  <text x="488" y="204" font-size="18" fill="#444" dominant-baseline="central">Home Assistant</text>
  <text x="646" y="204" font-size="24" fill="#000" dominant-baseline="central">remote, ok 14:05</text>

  <rect x="488" y="232" width="456" height="1" fill="#888"/>
  <text x="488" y="260" font-size="18" fill="#444" dominant-baseline="central">Wi-Fi</text>
  <text x="646" y="260" font-size="24" fill="#000" dominant-baseline="central">HomeNet-5G</text>

  <rect x="488" y="288" width="456" height="1" fill="#888"/>
  <text x="488" y="324" font-size="18" fill="#444" dominant-baseline="central">Config</text>
  <text x="646" y="324" font-size="24" fill="#000" dominant-baseline="central">OK</text>

  <rect x="488" y="360" width="456" height="1" fill="#888"/>
  <text x="488" y="388" font-size="18" fill="#444" dominant-baseline="central">Config errors</text>
  <text x="646" y="388" font-size="24" fill="#000" dominant-baseline="central">0</text>

  <!-- Footer: Refresh now (488,464,222,64), Back (722,464,222,64); cy 496; icon M at (+12,+12); label x = button x + 60 -->
  <rect x="489" y="465" width="220" height="62" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <use xlink:href="#i-refresh" href="#i-refresh" x="500" y="476" width="40" height="40" color="#000"/>
  <text x="548" y="496" font-size="24" fill="#000" dominant-baseline="central">Refresh now</text>
  <rect x="723" y="465" width="220" height="62" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <use xlink:href="#i-chev-l" href="#i-chev-l" x="734" y="476" width="40" height="40" color="#000"/>
  <text x="782" y="496" font-size="24" fill="#000" dominant-baseline="central">Back</text>
</svg>
