<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans">
  <!-- Settings overview, landscape. Spec: docs/ui/settings.md section 3/4. Shown: unsaved, focus on Network, 3 config errors. Widgets: w-1..w-4 category rows, w-5 Refresh now, w-6 Back. -->
