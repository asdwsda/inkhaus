<!-- Sleep screen, landscape, all optional blocks. Spec: sleep-screen.md. Shown: Tuesday 3 November, updated 14:05, next update 15:30, Touch and rocker wake. Widgets: w-1 date, w-2 updated/next, w-3 battery and indoor, w-4 weather, w-5 calendar, w-6 notifications, w-7 footer. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans">
<defs>
