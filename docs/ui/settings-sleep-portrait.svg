<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="540" height="960" viewBox="0 0 540 960" font-family="DejaVu Sans">
  <!-- Sleep and wake page, portrait. Spec: settings.md section 8.2. Shown: wake Touch (note visible), focus on Refresh every. Widgets: w-1..w-3 rows, w-4 note, w-5 Back. -->
  <defs>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="6.5" x2="12" y2="13.5" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1 -2.1 -5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="20,3 20,10 13,10" fill="currentColor"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><polyline points="9,4 17,12 9,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>

  <rect x="0" y="0" width="540" height="960" fill="#fff"/>
<text x="16" y="27" font-size="40" fill="#000" text-anchor="start" dominant-baseline="central">Sleep &amp; wake</text>
<rect x="404" y="11" width="120" height="32" rx="8" fill="#000"/>
<text x="464" y="27" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">unsaved</text>
<rect x="0" y="54" width="540" height="2" fill="#000"/>
<g id="w-1">
<rect id="w-1-frame" x="16" y="68" width="508" height="72" rx="8" fill="#fff"/>
<rect x="17" y="69" width="506" height="70" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-1-label" x="32" y="94" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Wake mode</text>
<circle id="w-1-pip0" cx="38" cy="117" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-1-pip1" cx="58" cy="117" r="6" fill="#000"/>
<circle id="w-1-pip2" cx="78" cy="117" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text id="w-1-value" x="508" y="104" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Touch</text>
</g>
<rect x="11.5" y="147.5" width="517" height="81" rx="12.5" fill="none" stroke="#000" stroke-width="3"/>
<g id="w-2">
<rect id="w-2-frame" x="16" y="152" width="508" height="72" rx="8" fill="#fff"/>
<rect x="17" y="153" width="506" height="70" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-2-label" x="32" y="178" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Refresh every</text>
<circle id="w-2-pip0" cx="38" cy="201" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip1" cx="58" cy="201" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip2" cx="78" cy="201" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip3" cx="98" cy="201" r="6" fill="#000"/>
<circle id="w-2-pip4" cx="118" cy="201" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-2-pip5" cx="138" cy="201" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text id="w-2-value" x="508" y="188" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">60 min</text>
</g>
<g id="w-3">
<rect id="w-3-frame" x="16" y="236" width="508" height="72" rx="8" fill="#fff"/>
<rect x="17" y="237" width="506" height="70" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-3-label" x="32" y="262" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Idle timeout</text>
<circle id="w-3-pip0" cx="38" cy="285" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-3-pip1" cx="58" cy="285" r="6" fill="#000"/>
<circle id="w-3-pip2" cx="78" cy="285" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<circle id="w-3-pip3" cx="98" cy="285" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
<text id="w-3-value" x="508" y="272" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">20 s</text>
</g>
<g id="w-4">
<rect id="w-4-frame" x="16" y="320" width="508" height="64" rx="8" fill="#fff"/>
<rect x="17" y="321" width="506" height="62" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<use id="w-4-icon" xlink:href="#i-alert" href="#i-alert" x="28" y="332" width="40" height="40" color="#000"/>
<text id="w-4-l1" x="80" y="341" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Touch wake shortens battery life.</text>
<text id="w-4-l2" x="80" y="363" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Button wake is recommended.</text>
</g>
<g id="w-5">
<rect id="w-5-frame" x="276" y="880" width="248" height="64" rx="8" fill="#fff"/>
<rect x="277" y="881" width="246" height="62" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<use id="w-5-icon" xlink:href="#i-chev-l" href="#i-chev-l" x="288" y="892" width="40" height="40" color="#000"/>
<text id="w-5-label" x="336" y="912" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Back</text>
</g>
</svg>
