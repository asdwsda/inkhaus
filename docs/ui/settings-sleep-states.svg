<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1064" height="1068" viewBox="0 0 1064 1068" font-family="DejaVu Sans">
<!-- Sleep and wake row states (task 085). Spec: settings.md 8.2. -->
<defs>
<symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="6.5" x2="12" y2="13.5" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></symbol>
<symbol id="i-chev-l" viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="i-wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9 A14 14 0 0 1 22 9"/><path d="M5.5 12.5 A9.5 9.5 0 0 1 18.5 12.5"/><path d="M9 16 A5 5 0 0 1 15 16"/></g><circle cx="12" cy="19.5" r="2" fill="currentColor"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.00 19.11 A10 10 0 1 1 6.29 3.96 A10 10 0 0 0 19.00 19.11 Z" fill="currentColor"/></symbol>
<symbol id="i-finger" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="10.8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3 V12"/><path d="M6.8 6.6 A8.4 8.4 0 1 0 17.2 6.6"/></g></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1 -2.1 -5" fill="none" stroke="currentColor" stroke-width="2.4"/><polygon points="21,3 21,11 13,11" fill="currentColor"/></symbol>
</defs>
<rect width="1064" height="1068" fill="#fff"/>
<text x="16" y="30" font-size="24" font-weight="bold" fill="#000" text-anchor="start" dominant-baseline="central">Sleep &amp; wake page: row and block states (portrait widths, 508 px)</text>
<text x="16" y="68" font-size="18" fill="#444" text-anchor="start" dominant-baseline="central">Sleep mode: the four values (hint is live)</text>
<g id="w-1">
<rect id="w-1-frame" x="16" y="84" width="508" height="88" rx="8" fill="#fff"/>
<rect x="17" y="85" width="506" height="86" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-1-label" x="32" y="116" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Sleep mode</text>
<text id="w-1-hint" x="32" y="146" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Lowest drain</text>
<text id="w-1-value" x="508" y="128" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Power off</text>
</g>
