<text xml:space="preserve" id="w-3-t108" x="212" y="1001" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Add a second network</text>
<text xml:space="preserve" id="w-3-t109" x="168" y="1060" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Network name (optional)</text>
