<rect x="892.5" y="1072.5" width="137" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t114" x="962" y="1106" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">Outside</text>
<text xml:space="preserve" id="w-3-t115" x="168" y="1178" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Wi-Fi name (SSID)</text>
<rect x="168.5" y="1190.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t116" x="187" y="1224" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">MyPhone</text>
<text xml:space="preserve" id="w-3-t117" x="612" y="1178" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Wi-Fi password</text>
<rect x="612.5" y="1190.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t118" x="631" y="1224" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">••••••••••</text>
<text xml:space="preserve" id="w-3-t119" x="168" y="1288" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Automatic: the device learns which address works on each network. Outside needs the address above.</text>
<text xml:space="preserve" id="w-3-t120" x="168" y="1312" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Not offered here: a fixed IP and more than two networks. Write secrets.yaml as a file (docs/CONFIG.md),</text>
<text xml:space="preserve" id="w-3-t121" x="168" y="1336" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">or paste a whole file instead.</text>
<rect x="168.5" y="1364.5" width="317" height="53" rx="4" fill="#fff" stroke="#888" stroke-width="3" stroke-dasharray="6 4"/>
<text xml:space="preserve" id="w-3-t122" x="328" y="1398" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Write secrets to device</text>
<rect x="512.5" y="1364.5" width="237" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t123" x="632" y="1398" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">Clear fields</text>
<text xml:space="preserve" id="w-3-t124" x="168" y="1446" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Disabled until the required fields are valid. Fields are cleared after a successful write,</text>
<text xml:space="preserve" id="w-3-t125" x="168" y="1470" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">and when you leave or reload this page.</text>
