<text xml:space="preserve" id="w-3-t21" x="202" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Must start with http:// or https://</text>
<text xml:space="preserve" id="w-3-t22" x="612" y="639" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Access token</text>
<rect x="613.5" y="650.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t23" x="632" y="684" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">••••••••••••••••••••••••</text>
<rect x="613.0" y="718.0" width="20" height="20" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>
<text xml:space="preserve" id="w-3-t24" x="623" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#000" text-anchor="middle" font-weight="bold">?</text>
<text xml:space="preserve" id="w-3-t25" x="646" y="734" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Looks short. Tokens have over 100 characters.</text>
<text xml:space="preserve" id="w-3-t101" x="168" y="789" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" font-weight="bold">Outside address (optional)</text>
<rect x="168.5" y="800.5" width="417" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t102" x="187" y="834" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">https://example.ui.nabu.casa</text>
<text xml:space="preserve" id="w-3-t103" x="612" y="818" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Used away from home. Must start with https://.</text>
<text xml:space="preserve" id="w-3-t104" x="612" y="842" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Leave empty if you only use it at home.</text>
<rect x="168.5" y="876.5" width="25" height="25" rx="2" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t105" x="212" y="897" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Show characters</text>
<text xml:space="preserve" id="w-3-t106" x="168" y="960" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Second Wi-Fi network (optional)</text>
<rect x="168.5" y="980.5" width="25" height="25" rx="2" fill="#000" stroke="#000" stroke-width="3"/>
