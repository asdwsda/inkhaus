<text xml:space="preserve" id="w-6-t44" x="144" y="1507" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Inkhaus, open source on GitHub. Install page powered by ESP Web Tools.</text>
</g>
