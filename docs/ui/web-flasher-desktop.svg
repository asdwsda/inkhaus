</g>
<g id="w-2">
<rect id="w-2-frame" x="120" y="96" width="960" height="217" rx="0" fill="none" stroke="none" stroke-width="1"/>
<text xml:space="preserve" id="w-2-t7" x="144" y="166" font-family="DejaVu Sans, Verdana, sans-serif" font-size="40" fill="#000" text-anchor="start" font-weight="bold">Install Inkhaus</text>
<text xml:space="preserve" id="w-2-t8" x="144" y="222" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Connect your M5Paper with a USB cable and install</text>
<text xml:space="preserve" id="w-2-t9" x="144" y="249" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Inkhaus here in the browser. No tools to download.</text>
<text xml:space="preserve" id="w-2-t10" x="144" y="276" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Your settings and SD card are kept when you update.</text>
</g>
<g id="w-3">
<rect id="w-3-frame" x="144" y="329" width="912" height="396" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-3-t11" x="168" y="379" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">1. Choose a version</text>
<rect x="169.5" y="398.5" width="517" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t12" x="184" y="431" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">1.2.0 latest stable, 2026-11-01</text>
<polygon id="w-3-i13" points="648,420 664,420 656,430" fill="#000"/>
<text xml:space="preserve" id="w-3-t14" x="712" y="431" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">2.3 MB</text>
<rect x="169.5" y="462.5" width="25" height="25" rx="2" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t15" x="212" y="483" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Show pre-releases</text>
<text xml:space="preserve" id="w-3-t16" x="168" y="543" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">2. Install</text>
<rect x="169.5" y="562.5" width="317" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t17" x="328.0" y="595.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">Install 1.2.0</text>
<text xml:space="preserve" id="w-3-t18" x="168" y="649" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">A browser window asks for the USB port: pick the</text>
<text xml:space="preserve" id="w-3-t19" x="168" y="673" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">new entry that appears when you plug in the M5Paper.</text>
<text xml:space="preserve" id="w-3-t20" x="168" y="697" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Your settings and SD card are kept.</text>
</g>
<g id="w-4">
<rect id="w-4-frame" x="120" y="773" width="960" height="380" rx="0" fill="none" stroke="none" stroke-width="1"/>
<line x1="120" y1="773" x2="1080" y2="773" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t21" x="144" y="837" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">Before you start</text>
<rect x="144.5" y="869.5" width="287.0" height="199" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t22" x="160.0" y="913" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">1</text>
<text xml:space="preserve" id="w-4-t23" x="160.0" y="945" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Use a data cable</text>
<text xml:space="preserve" id="w-4-t24" x="160.0" y="975" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Some USB cables only</text>
<text xml:space="preserve" id="w-4-t25" x="160.0" y="1002" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">charge. Use one that</text>
<text xml:space="preserve" id="w-4-t26" x="160.0" y="1029" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">also carries data.</text>
<rect x="456.5" y="869.5" width="287.0" height="199" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t27" x="472.0" y="913" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">2</text>
<text xml:space="preserve" id="w-4-t28" x="472.0" y="945" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Windows: driver</text>
<text xml:space="preserve" id="w-4-t29" x="472.0" y="975" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Windows may need the</text>
<text xml:space="preserve" id="w-4-t30" x="472.0" y="1002" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">CH9102 USB driver once.</text>
<text xml:space="preserve" id="w-4-t31" x="472.0" y="1029" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Mac and Linux do not.</text>
<text xml:space="preserve" id="w-4-t32" x="472.0" y="1064" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start" text-decoration="underline">Get the CH9102 driver</text>
<rect x="768.5" y="869.5" width="287.0" height="199" rx="0" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-4-t33" x="784.0" y="913" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">3</text>
<text xml:space="preserve" id="w-4-t34" x="784.0" y="945" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">Pick the right browser</text>
<text xml:space="preserve" id="w-4-t35" x="784.0" y="975" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Chrome, Edge or Opera</text>
<text xml:space="preserve" id="w-4-t36" x="784.0" y="1002" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">on a computer. Not</text>
<text xml:space="preserve" id="w-4-t37" x="784.0" y="1029" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Firefox or Safari.</text>
</g>
<g id="w-5">
<rect id="w-5-frame" x="120" y="1153" width="960" height="300" rx="0" fill="none" stroke="none" stroke-width="1"/>
<line x1="120" y1="1153" x2="1080" y2="1153" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-5-t38" x="144" y="1217" font-family="DejaVu Sans, Verdana, sans-serif" font-size="28" fill="#000" text-anchor="start" font-weight="bold">After the install</text>
<text xml:space="preserve" id="w-5-t39" x="144" y="1257" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">The M5Paper restarts and asks for its files. Copy these two files to the</text>
<text xml:space="preserve" id="w-5-t40" x="144" y="1284" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">root of its SD card (FAT32), put the card in, and restart it:</text>
<rect x="144.5" y="1303.5" width="911" height="83" rx="0" fill="#f2f2f2" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-5-t41" x="160" y="1333" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#000" text-anchor="start">config.yaml    your tabs and widgets</text>
<text xml:space="preserve" id="w-5-t42" x="160" y="1357" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#000" text-anchor="start">secrets.yaml   Wi-Fi and Home Assistant token</text>
<text xml:space="preserve" id="w-5-t43" x="144" y="1419" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">How to write them: docs/CONFIG.md</text>
</g>
<g id="w-6">
<rect id="w-6-frame" x="120" y="1453" width="960" height="100" rx="0" fill="none" stroke="none" stroke-width="1"/>
