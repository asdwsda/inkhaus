<text xml:space="preserve" id="w-1-t3" x="700" y="56" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">Features</text>
<text xml:space="preserve" id="w-1-t4" x="820" y="56" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">Install</text>
<text xml:space="preserve" id="w-1-t5" x="910" y="56" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" text-decoration="underline">Set up</text>
