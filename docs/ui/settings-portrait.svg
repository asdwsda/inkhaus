<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="540" height="960" viewBox="0 0 540 960" font-family="DejaVu Sans">
  <!-- Settings, portrait 540x960. Spec: docs/ui/settings.md section 3 (revision 3: targets >= 64, gaps 12, centre-line alignment). Greys only: #000, #444, #888, #fff.
       State shown: wake mode = Touch (unsaved, warning visible), rocker focus on row 2, HA offline, config with 3 errors.
       Every <text> uses dominant-baseline="central": its y is the centre line. Icons are placed so that y + size/2 is the centre line. -->
  <defs>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="6.5" x2="12" y2="13.5" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1 -2.1 -5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="20,3 20,10 13,10" fill="currentColor"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>

  <rect x="0" y="0" width="540" height="960" fill="#fff"/>

  <!-- Header (0,0,540,56): title cy 27, unsaved chip (404,11,120,32), rule (0,54,540,2) -->
  <text x="16" y="27" font-size="40" fill="#000" dominant-baseline="central">Settings</text>
  <rect x="404" y="11" width="120" height="32" rx="8" fill="#000"/>
  <text x="464" y="27" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">unsaved</text>
  <rect x="0" y="54" width="540" height="2" fill="#000"/>

  <!-- Row 1 Orientation (16,68,508,88), value cy 112, label cy 98, pips cy 130: Portrait, pip 0 of 2 -->
  <rect x="17" y="69" width="506" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="98" font-size="24" fill="#000" dominant-baseline="central">Orientation</text>
  <circle cx="38" cy="130" r="6" fill="#000"/>
  <circle cx="58" cy="130" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="508" y="112" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Portrait</text>

  <!-- Row 2 Wake mode (16,168,508,88): Touch + battery warning; FOCUS RING = rect inflated 3..6 px, stroke 3 centred 4.5 px outside: (11.5,163.5,517,97) -->
  <rect x="11.5" y="163.5" width="517" height="97" rx="12.5" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="17" y="169" width="506" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="198" font-size="24" fill="#000" dominant-baseline="central">Wake mode</text>
  <use xlink:href="#i-warn" href="#i-warn" x="32" y="218" width="24" height="24" color="#000"/>
  <text x="62" y="230" font-size="18" fill="#000" dominant-baseline="central">drains battery</text>
  <text x="508" y="212" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Touch</text>

  <!-- Row 3 Refresh every (16,268,508,88): 60 min, pip 3 of 6 -->
  <rect x="17" y="269" width="506" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="298" font-size="24" fill="#000" dominant-baseline="central">Refresh every</text>
  <circle cx="38" cy="330" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="58" cy="330" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="78" cy="330" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="98" cy="330" r="6" fill="#000"/>
  <circle cx="118" cy="330" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="138" cy="330" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="508" y="312" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">60 min</text>

  <!-- Row 4 Idle timeout (16,368,508,88): 20 s, pip 1 of 4 -->
  <rect x="17" y="369" width="506" height="86" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="32" y="398" font-size="24" fill="#000" dominant-baseline="central">Idle timeout</text>
  <circle cx="38" cy="430" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="58" cy="430" r="6" fill="#000"/>
  <circle cx="78" cy="430" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="98" cy="430" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="508" y="412" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">20 s</text>

  <!-- Note slot (16,468,508,64), cy 500: visible because wake mode = Touch. Alert icon M (28,480,40,40); text lines cy 489 / 511 from x=80 -->
  <rect x="17" y="469" width="506" height="62" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <use xlink:href="#i-alert" href="#i-alert" x="28" y="480" width="40" height="40" color="#000"/>
  <text x="80" y="489" font-size="18" fill="#000" dominant-baseline="central">Touch wake shortens battery life.</text>
  <text x="80" y="511" font-size="18" fill="#000" dominant-baseline="central">Button wake is recommended.</text>

  <!-- Info rows: hairline (OFF grey) at the top edge of each row; label x=16 F18 DIM; value x=174 F24; cy = row y + h/2 -->
  <rect x="16" y="548" width="508" height="1" fill="#888"/>
  <text x="16" y="572" font-size="18" fill="#444" dominant-baseline="central">Firmware</text>
  <text x="174" y="572" font-size="24" fill="#000" dominant-baseline="central">v0.3.1</text>

  <rect x="16" y="596" width="508" height="1" fill="#888"/>
  <text x="16" y="620" font-size="18" fill="#444" dominant-baseline="central">Battery</text>
  <text x="174" y="620" font-size="24" fill="#000" dominant-baseline="central">78%, 3.92 V</text>

  <rect x="16" y="644" width="508" height="1" fill="#888"/>
  <text x="16" y="668" font-size="18" fill="#444" dominant-baseline="central">Home Assistant</text>
  <use xlink:href="#i-alert" href="#i-alert" x="174" y="656" width="24" height="24" color="#000"/>
  <text x="206" y="668" font-size="24" fill="#000" dominant-baseline="central">offline, last ok 13:05</text>

  <rect x="16" y="692" width="508" height="1" fill="#888"/>
  <text x="16" y="716" font-size="18" fill="#444" dominant-baseline="central">Wi-Fi</text>
  <text x="174" y="716" font-size="24" fill="#000" dominant-baseline="central">HomeNet-5G</text>

  <rect x="16" y="740" width="508" height="1" fill="#888"/>
  <text x="16" y="772" font-size="18" fill="#444" dominant-baseline="central">Config</text>
  <use xlink:href="#i-alert" href="#i-alert" x="174" y="746" width="24" height="24" color="#000"/>
  <text x="206" y="758" font-size="24" fill="#000" dominant-baseline="central">tabs[0].widgets[2].entity</text>
  <text x="206" y="786" font-size="24" fill="#000" dominant-baseline="central">(line 34)</text>

  <rect x="16" y="804" width="508" height="1" fill="#888"/>
  <text x="16" y="828" font-size="18" fill="#444" dominant-baseline="central">Config errors</text>
  <text x="174" y="828" font-size="24" fill="#000" dominant-baseline="central">3</text>

  <!-- Footer: Refresh now (16,880,248,64), Back (276,880,248,64); cy 912; icon M at (+12,+12); label x = button x + 60 -->
  <rect x="17" y="881" width="246" height="62" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <use xlink:href="#i-refresh" href="#i-refresh" x="28" y="892" width="40" height="40" color="#000"/>
  <text x="76" y="912" font-size="24" fill="#000" dominant-baseline="central">Refresh now</text>
  <rect x="277" y="881" width="246" height="62" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <use xlink:href="#i-chev-l" href="#i-chev-l" x="288" y="892" width="40" height="40" color="#000"/>
  <text x="336" y="912" font-size="24" fill="#000" dominant-baseline="central">Back</text>
</svg>
