<text xml:space="preserve" id="w-4-t52" x="168" y="1328" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Only needed on a new device or when they change. Nothing you type is stored or sent.</text>
