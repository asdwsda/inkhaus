<text xml:space="preserve" id="w-3-t19" x="218" y="629" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">3</text>
<text xml:space="preserve" id="w-3-t20" x="244" y="629" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">groups:</text>
<text xml:space="preserve" id="w-3-t21" x="218" y="653" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">4</text>
<text xml:space="preserve" id="w-3-t22" x="244" y="653" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">  downstairs_shutters: [cover.living_room_shutter,</text>
<text xml:space="preserve" id="w-3-t23" x="218" y="677" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">5</text>
<text xml:space="preserve" id="w-3-t24" x="244" y="677" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">    cover.kitchen_shutter]</text>
<text xml:space="preserve" id="w-3-t25" x="218" y="701" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">6</text>
<text xml:space="preserve" id="w-3-t26" x="244" y="701" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">tabs:</text>
<text xml:space="preserve" id="w-3-t27" x="218" y="725" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">7</text>
<text xml:space="preserve" id="w-3-t28" x="244" y="725" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">  - title: Living room</text>
<text xml:space="preserve" id="w-3-t29" x="218" y="749" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">8</text>
<text xml:space="preserve" id="w-3-t30" x="244" y="749" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">    widgets:</text>
<text xml:space="preserve" id="w-3-t31" x="218" y="773" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888" text-anchor="end">9</text>
<text xml:space="preserve" id="w-3-t32" x="244" y="773" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#000" text-anchor="start">      - entity: cover.living_room_shutter</text>
