<text xml:space="preserve" id="w-3-t13" x="224" y="474" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">From the M5Paper (Inkhaus 1.5.0) at 14:32. Your edits stay on this page until you write.</text>
