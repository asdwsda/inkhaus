<text xml:space="preserve" id="w-2-t8" x="144" y="249" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start">Everything stays in this browser. Nothing is uploaded.</text>
</g>
<g id="w-3"><rect id="w-3-frame" x="144" y="290" width="912" height="922" fill="#fff" stroke="#888" stroke-width="1"/>
<text xml:space="preserve" id="w-3-t9" x="168" y="340" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">1. Connect and read</text>
<rect x="169.5" y="357.5" width="317" height="53" rx="4" fill="#000" stroke="#000" stroke-width="3"/>
