<text xml:space="preserve" id="w-3-t39" x="168" y="892" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" font-weight="bold">Check: 1 error, 1 warning</text>
<rect x="168.5" y="912.5" width="27" height="27" rx="2" fill="#000" stroke="#000" stroke-width="1"/>
<text xml:space="preserve" id="w-3-t40" x="182" y="933" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">!</text>
<text xml:space="preserve" id="w-3-t41" x="212" y="933" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" font-weight="bold">Line 10</text>
<text xml:space="preserve" id="w-3-t42" x="302" y="933" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Missing ':' after 'entity'. Write it as 'entity: light.living_room_ceiling'.</text>
<rect x="169.5" y="961.5" width="25" height="25" rx="2" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t43" x="182" y="981" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="middle" font-weight="bold">?</text>
<text xml:space="preserve" id="w-3-t44" x="212" y="981" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="start" font-weight="bold">Line 12</text>
<text xml:space="preserve" id="w-3-t45" x="302" y="981" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#000" text-anchor="start">Unknown key 'colour'. The device ignores it.</text>
<text xml:space="preserve" id="w-3-t46" x="168" y="1038" font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" fill="#000" text-anchor="start" font-weight="bold">3. Write to device</text>
<rect x="169.5" y="1057.5" width="317" height="53" rx="4" fill="#fff" stroke="#888" stroke-width="3" stroke-dasharray="6 4"/>
<text xml:space="preserve" id="w-3-t47" x="328.0" y="1090" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#888" text-anchor="middle" font-weight="bold">Write to device</text>
<rect x="513.5" y="1057.5" width="237" height="53" rx="4" fill="#fff" stroke="#000" stroke-width="3"/>
<text xml:space="preserve" id="w-3-t48" x="632.0" y="1090" font-family="DejaVu Sans, Verdana, sans-serif" font-size="18" fill="#000" text-anchor="middle" font-weight="bold">Discard edits</text>
<text xml:space="preserve" id="w-3-t49" x="168" y="1136" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Disabled while the check shows an error. The M5Paper restarts and loads the new layout (about 10 s).</text>
<text xml:space="preserve" id="w-3-t50" x="168" y="1160" font-family="DejaVu Sans, Verdana, sans-serif" font-size="16" fill="#444" text-anchor="start">Limit 64 KB. The old file is replaced.</text>
</g>
<g id="w-4"><rect id="w-4-frame" x="144" y="1244" width="912" height="184" fill="#fff" stroke="#888" stroke-width="1"/>
