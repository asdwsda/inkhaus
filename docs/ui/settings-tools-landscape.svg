<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans">
  <!-- Tools page, landscape. Spec: settings.md section 8.4. Widgets: rows, note (portrait, debug log On), Back. -->
  <defs>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="6.5" x2="12" y2="13.5" stroke="currentColor" stroke-width="2.5"/><circle cx="12" cy="17" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12 a7 7 0 1 1 -2.1 -5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="20,3 20,10 13,10" fill="currentColor"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><polyline points="9,4 17,12 9,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#fff"/>
<text x="16" y="25" font-size="40" fill="#000" text-anchor="start" dominant-baseline="central">Tools</text>
<rect x="824" y="9" width="120" height="32" rx="8" fill="#000"/>
<text x="884" y="25" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">unsaved</text>
<rect x="0" y="50" width="960" height="2" fill="#000"/>
<g id="w-1">
<rect id="w-1-frame" x="16" y="64" width="456" height="88" rx="8" fill="#fff"/>
<rect x="17" y="65" width="454" height="86" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-1-label" x="32" y="96" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Demo mode</text>
<text id="w-1-hint" x="32" y="126" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Sample dashboard, offline</text>
<text id="w-1-value" x="456" y="108" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">On</text>
</g>
<g id="w-2">
<rect id="w-2-frame" x="488" y="64" width="456" height="88" rx="8" fill="#fff"/>
<rect x="489" y="65" width="454" height="86" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<text id="w-2-label" x="504" y="96" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Debug log</text>
<text id="w-2-hint" x="504" y="126" font-size="18" fill="#000" text-anchor="start" dominant-baseline="central">Log lines to SD card</text>
<text id="w-2-value" x="928" y="108" font-size="40" fill="#000" text-anchor="end" dominant-baseline="central">Off</text>
</g>
<rect x="717.5" y="459.5" width="231" height="73" rx="12.5" fill="none" stroke="#000" stroke-width="3"/>
<g id="w-3">
<rect id="w-3-frame" x="722" y="464" width="222" height="64" rx="8" fill="#fff"/>
<rect x="723" y="465" width="220" height="62" rx="8" fill="none" stroke="#000" stroke-width="2"/>
<use id="w-3-icon" xlink:href="#i-chev-l" href="#i-chev-l" x="734" y="476" width="40" height="40" color="#000"/>
<text id="w-3-label" x="782" y="496" font-size="24" fill="#000" text-anchor="start" dominant-baseline="central">Back</text>
</g>
</svg>
