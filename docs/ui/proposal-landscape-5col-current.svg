<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="540" viewBox="0 0 960 540" font-family="DejaVu Sans">
<!-- CURRENT approved 5-column grid (layout.md): same content. Wide = 3 cells = 552, so each cover/climate takes its own row; the 4 toggles first-fit into the free 2-cell gaps beside the first two rows. -->
<defs>
    <symbol id="i-up" viewBox="0 0 24 24"><polygon points="12,5 21,19 3,19" fill="currentColor"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><polygon points="12,19 21,5 3,5" fill="currentColor"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M12 2 a7 7 0 0 0 -4 12.7 V18 h8 v-3.3 A7 7 0 0 0 12 2z" fill="currentColor"/><rect x="8.5" y="19.5" width="7" height="2.5" fill="currentColor"/></symbol>
    <symbol id="i-bulb-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 a6.5 6.5 0 0 0 -3.6 11.9 V18 h7.2 v-3.1 A6.5 6.5 0 0 0 12 3z"/><path d="M9 21 H15"/></g></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><rect x="8" y="2" width="2.5" height="6" fill="currentColor"/><rect x="13.5" y="2" width="2.5" height="6" fill="currentColor"/><path d="M6 8 H18 V12 A6 6 0 0 1 6 12 Z" fill="currentColor"/><rect x="10.75" y="17.5" width="2.5" height="4.5" fill="currentColor"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4.5 12 A7.5 7.5 0 0 1 19.5 12"/><path d="M19.5 12 A7.5 7.5 0 0 1 4.5 12"/></g><polygon points="15.5,10.5 23.5,10.5 19.5,15.5" fill="currentColor"/><polygon points="0.5,13.5 8.5,13.5 4.5,8.5" fill="currentColor"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2 C12 2 5 10 5 15 a7 7 0 0 0 14 0 C19 10 12 2 12 2z" fill="currentColor"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="3" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="3" fill="currentColor"/><rect x="10.5" y="4" width="3" height="16" fill="currentColor"/></symbol>
    <!-- flame: two tongues (tip at 14,1.5 and 7.6,8.2) and a hollow teardrop, so it never reads as a drop -->
    <symbol id="i-flame" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 22 C7.5 22 4.5 19 4.5 15 C4.5 12 6.2 10.2 7.6 8.2 C8.2 9.4 8.6 10.2 9.4 10.8 C9.6 7 11.2 3.6 14 1.5 C14.2 5 16.8 7 18.2 10.2 C19.6 13.4 19.5 15 19.5 15 C19.5 19 16.5 22 12 22 Z M12 20 C10.2 20 8.8 18.8 8.8 17.2 C8.8 15.8 10.2 14.8 12 12.6 C13.8 14.8 15.2 15.8 15.2 17.2 C15.2 18.8 13.8 20 12 20 Z" fill="currentColor"/></symbol>
    <symbol id="i-window-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M12 3 V21 M3 12 H21"/></g></symbol>
    <symbol id="i-window-on" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1" fill="currentColor"/><path d="M12 3 V21 M3 12 H21" fill="none" stroke="#fff" stroke-width="2"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19 A4.5 4.5 0 0 1 6.6 10.05 A6 6 0 0 1 18.2 9.2 A5 5 0 0 1 17.5 19 Z" fill="currentColor"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9 A14 14 0 0 1 22 9"/><path d="M5.5 12.5 A9.5 9.5 0 0 1 18.5 12.5"/><path d="M9 16 A5 5 0 0 1 15 16"/></g><circle cx="12" cy="19.5" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M7 3 H17 V8 L12 12 L17 16 V21 H7 V16 L12 12 L7 8 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs>
<rect x="0" y="0" width="960" height="540" fill="#fff"/>
<!-- Top bar, status part. Connection icon (16,20,24,24), centre line y=32; label x=56, two lines at cy 21 and 43 -->
  <use xlink:href="#i-wifi" href="#i-wifi" x="16" y="20" width="24" height="24" color="#000"/>
  <text x="56" y="21" font-size="18" fill="#000" dominant-baseline="central">updated</text>
  <text x="56" y="43" font-size="18" fill="#000" dominant-baseline="central">14:05</text>
  <!-- Battery icon at (848,22): body (848,22,36,20), inner (850,24,32,16), level fill 25 px (78 %), nub (884,27,4,10); percent right edge x=944, cy 32 -->
  <rect x="848" y="22" width="36" height="20" fill="#000"/>
  <rect x="850" y="24" width="32" height="16" fill="#fff"/>
  <rect x="850" y="24" width="25" height="16" fill="#000"/>
  <rect x="884" y="27" width="4" height="10" fill="#000"/>
  <text x="944" y="32" font-size="18" fill="#000" text-anchor="end" dominant-baseline="central">78%</text>

  <!-- Tab strip: 5 slots x=172,304,436,568,700 (120x56), y=4 -->
<rect x="172" y="4" width="120" height="56" rx="8" fill="#000"/>
<text x="232" y="32" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="central">Demo</text>
<rect x="305" y="5" width="118" height="54" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="364" y="32" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central">Lights</text>
<rect x="437" y="5" width="118" height="54" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="496" y="32" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central">Shutters</text>
<rect x="569" y="5" width="118" height="54" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="628" y="32" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central">Clima</text>
