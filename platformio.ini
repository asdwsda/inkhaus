; M5Paper Home Assistant remote. Platform and libraries are pinned on purpose.

[platformio]
default_envs = m5paper

; libyaml is a plain C library without a library.json or config.h, so its
; version macros (normally supplied by its build system) are defined here.
; Shared by both envs.
[libyaml]
lib_deps = https://github.com/yaml/libyaml.git#0.2.5
build_flags =
    -DYAML_VERSION_MAJOR=0
    -DYAML_VERSION_MINOR=2
    -DYAML_VERSION_PATCH=5
    -DYAML_VERSION_STRING=\"0.2.5\"

[env:m5paper]
platform = espressif32@6.12.0
; No M5Paper board in platform 6.12.0. m5stack-fire is the same ESP32, 16 MB flash,
; 8 MB PSRAM; it adds -DBOARD_HAS_PSRAM and the PSRAM cache-issue fix flags.
board = m5stack-fire
framework = arduino
monitor_speed = 115200
; default_16MB.csv: two app slots plus a 'spiffs'-type partition used for LittleFS.
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
; The demo config (shown when the SD card has no config.yaml): demo.yaml linked into the
; firmware as _binary_demo_yaml_start/_end.
board_build.embed_txtfiles = demo.yaml
; Root CA bundle for https (task 008), regenerated by tools/gen_ca_bundle.sh.
board_build.embed_files = certs/x509_crt_bundle
; lib/ is C++17 (see lib/README.md); the core defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    ${libyaml.build_flags}
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    bblanchon/ArduinoJson@7.4.3
    ${libyaml.lib_deps}

; Hardware probe (task 013): same toolchain and libraries as m5paper, but compiles
; only probe/. It does not touch lib/ or src/ (SD mount code is duplicated in the probe).
[env:probe]
extends = env:m5paper
build_src_filter = -<*> +<../probe/>

; E-ink persistence and refresh-mode experiment (task 015): compiles only epdtest/.
[env:epdtest]
extends = env:m5paper
build_src_filter = -<*> +<../epdtest/>

; Test build: adds the serial test commands (shot, shotz, shotp, tap, key, pend, mem, cleanup).
; Use it when screenshots or serial taps are needed.
[env:m5paper-debug]
extends = env:m5paper
build_flags =
    ${env:m5paper.build_flags}
    -DDEBUG_SERIAL

; Battery test build (task 029): forces the debug log on (every build has it, off by default via the
; debug_log setting): one CSV line per wake in /wakelog.csv + /debug.log; serial `wakelog`/`debuglog`
; stream them (tools/wakelog.py). Costs an SD mount per wake.
[env:m5paper-batterytest]
extends = env:m5paper
build_flags =
    ${env:m5paper.build_flags}
    -DWAKE_LOG_SD

[env:native]
platform = native
test_framework = unity
; Host tests never compile src/ (only lib/ and test/).
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    ${libyaml.build_flags}
lib_deps =
    throwtheswitch/Unity@2.6.1
    bblanchon/ArduinoJson@7.4.3
    ${libyaml.lib_deps}
