# M5Paper HA remote: built-in demo dashboard (schema v1).
#
# Shown (with fake values, no Home Assistant) when the SD card has no config.yaml. Embedded in the
# firmware. It doubles as a showcase of every widget type and state look. No connection, no secrets.
# Six tabs, each fills one page in portrait (2x7 cells) and landscape (5x4 cells), no pager.

version: 1

groups:
  downstairs_shutters: [cover.living_room_shutter, cover.kitchen_shutter, cover.hall_shutter]

tabs:
  - title: Living room
    widgets:
      - entity: cover.living_room_shutter
        name: Shutter
      - group: downstairs_shutters
        name: Downstairs shutters
      - entity: climate.living_room
      - entity: light.living_room_ceiling       # brightness 80 %
      - entity: light.living_room_floor_lamp
        name: Floor lamp
      - entity: light.kitchen_ceiling           # brightness 50 %
        name: Kitchen
      - entity: switch.living_room_fan
      - entity: switch.tv
        name: TV
      - entity: switch.coffee_machine_fails     # a tap ends in the Failed state
        name: Coffee (fails)
      - entity: binary_sensor.living_room_window
      - entity: automation.night_mode
        name: Night mode
  - title: Upstairs
    widgets:
      - entity: cover.bedroom_shutter
        name: Bedroom shutter
      - entity: climate.bedroom
      - entity: vacuum.upstairs
        name: Robot
      - entity: light.bedroom_ceiling
        name: Bedroom
      - entity: light.bedroom_left
        name: Left
      - entity: light.bedroom_right
        name: Right
      - entity: light.office_desk
        name: Desk
      - entity: light.bathroom
      - entity: light.guest_room
        name: Guest
      - entity: switch.printer
        name: Printer
      - entity: automation.good_night
        name: Night
  - title: Sensors
    widgets:
      - entity: sensor.living_room_climate
        name: Living room
        size: 2x1
        attribute: temperature
        details: [humidity, dew_point]
        decimals: 1
      - entity: sensor.power_meter
        name: Power
        size: 2x1
        details: [today]
      - entity: weather.home
      - entity: sensor.outside_temperature      # tap opens the history popup
        name: Outside
      - entity: sensor.pressure
        details: [trend]
      - entity: sensor.attic_climate
        name: Attic
        attribute: temperature
        details: [humidity]
        decimals: 1
      - entity: sensor.old_probe_unavailable    # deliberately unavailable
        name: Old probe
      - entity: binary_sensor.front_door
        name: Front door
      - entity: binary_sensor.garage_door
        name: Garage
      - entity: binary_sensor.hall_motion
        name: Hall
      - entity: binary_sensor.basement_moisture
        name: Basement
  - title: Garden
    widgets:
      - entity: sensor.outside_temperature      # history graph on the tab (task 071)
        name: Outside
        display: graph
        decimals: 1
      - entity: sensor.power_meter
        name: Power per day
        display: graph
        history: { hours: 168, type: bar }
      - entity: binary_sensor.front_door
        name: Front door
        display: graph
        size: 2x1
      - entity: cover.terrace_shutter
        name: Terrace
      - entity: switch.garden_pump
        name: Pump
      - entity: switch.terrace_heater
        name: Heater
  - title: Calendar                          # task 105: sample events, one case per widget (see calendar_glue.cpp)
    widgets:
      - entity: calendar.family                 # a timed event today, then one on another day
      - entity: calendar.empty                  # nothing planned
      - entity: calendar.work                   # running now, then all day tomorrow
      - entity: calendar.holidays               # all day today, then a long title
      - entity: calendar.old_unavailable        # deliberately unavailable
  - title: New                               # tasks 103, 104, 106, 107, 109: notifications, forecast, media players with art, energy
    widgets:
      - type: notifications
        name: Alerts
      - entity: weather.garden                  # partly cloudy with the 3-day forecast (fake days, see forecast_glue.cpp)
        forecast: true
      - type: energy                            # fake running totals: today so far, usage and solar
        usage: sensor.house_energy_total
        solar: sensor.solar_energy_total
      - entity: media_player.living_room        # playing, with the built-in sample cover (task 107)
      - entity: media_player.kitchen            # paused, no picture (tile)
  - title: Alarm                             # task 108: alarm panels in every state (fake data)
    widgets:
      - entity: alarm_control_panel.home        # disarmed; tap for the keypad, the demo code is 1234
        name: Alarm
      - entity: alarm_control_panel.away        # armed away
        name: Away
      - entity: alarm_control_panel.night       # armed night
        name: Night
      - entity: alarm_control_panel.garden      # armed home
        name: Garden
      - entity: alarm_control_panel.arming      # arming
        name: Arming
      - entity: alarm_control_panel.entry       # pending (entry delay)
        name: Entry
      - entity: alarm_control_panel.triggered   # triggered: INK fill
        name: Siren
      - entity: alarm_control_panel.old_unavailable  # deliberately unavailable
        name: Old panel
  - title: Doors                             # task 108: locks and garage doors in every state (fake data)
    widgets:
      - entity: lock.front_door                 # locked; unlocking asks first
        name: Front door
      - entity: lock.back_door                  # open (unlocked): INK fill, locking does not ask
        name: Back door
      - entity: lock.cellar                     # jammed: INK fill, alert glyph
        name: Cellar
      - entity: lock.shed                       # unlocking
        name: Shed
      - entity: lock.old_unavailable            # deliberately unavailable
        name: Old lock
      - entity: cover.garage                    # closed; both directions ask first
        type: garage
        name: Garage
      - entity: cover.garage_open               # open: INK fill
        type: garage
        name: Carport
      - entity: cover.garage_moving             # opening: a tap stops it, no question
        type: garage
        name: Gate
      - entity: cover.garage_unavailable        # deliberately unavailable
        type: garage
        name: Old door
