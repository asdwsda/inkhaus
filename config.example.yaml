# M5Paper HA remote: example configuration (schema v1).
#
# Copy this file to the ROOT of the SD card and name it `config.yaml`.
# The real config.yaml is gitignored (it is your personal layout). All values below are fake.

version: 1

# Wi-Fi, Home Assistant URLs and the token do NOT go here: they live in /secrets.yaml on the SD card
# (copy secrets.example.yaml). config.yaml holds only the dashboard and is not secret.

# Optional. POSIX TZ string for the clock and the wake-up schedule. Default: Central Europe.
# timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

# Optional blocks of the sleep screen (Settings > Sleep & wake > While asleep = Sleep screen).
sleep_screen:
  weather: weather.home
  calendar: calendar.family
  notifications: true

# Optional device-side entity lists. All members must share one domain.
# Group names: lowercase letters, digits and underscore only.
groups:
  downstairs_shutters: [cover.living_room_shutter, cover.kitchen_shutter, cover.hall_shutter]
  all_shutters:
    - cover.living_room_shutter
    - cover.kitchen_shutter
    - cover.hall_shutter
    - cover.bedroom_shutter

# At least one tab (max 16, up to 24 widgets each).
# Widget type is inferred from the entity domain: cover, light, switch,
# automation, climate, sensor, binary_sensor, weather, vacuum, media_player, calendar.
# Optional `size: WxH` (1..4 cells) picks a size within what the widget type allows
# (docs/ui/layout.md section 3); most types have a fixed size, so it is rarely needed.
# Sensor options, graphs and history are shown at the end of the "Whole house" tab at the end of this file.
tabs:
  - title: Living room
    # landscape_columns: 4   # optional: 4 or 5 (default 5)
    # portrait_columns: 3    # optional: 2, 3 or 4 (default 2); 3: 161 px cells, 4: 118 px cells (1x1 only for
    #                        # sensor, binary_sensor, switch, light, automation)
    widgets:
      - entity: cover.living_room_shutter
        name: Shutter            # optional, default: HA friendly_name
      - group: downstairs_shutters
        name: Downstairs shutters  # required for groups
      - entity: light.living_room_ceiling
      - entity: light.living_room_floor_lamp
        name: Floor lamp
      - entity: switch.living_room_fan
      - entity: climate.living_room
      - entity: binary_sensor.living_room_window
  - title: Whole house
    widgets:
      - group: all_shutters
        name: All shutters
      - entity: automation.night_mode
        name: Night mode
      - entity: climate.bedroom
      - entity: climate.kitchen
      - entity: sensor.outside_temperature
        name: Outside
      - entity: weather.home
      - entity: weather.home    # a second one with the 3-day forecast (needs a wide widget)
        forecast: true
      - entity: vacuum.robot
        name: Vacuum
      - entity: calendar.family            # 2x1: the next two events (read only)
      - entity: media_player.living_room   # wide; tap the text or the cover for the volume popup
        name: Living room
        art: true                          # cover art of the track (default); false = text only
      - entity: person.alice    # no built-in type for this domain, so set it
        type: sensor
      - entity: cover.living_room_shutter   # also used above: fetched once
      # Home Assistant persistent notifications: count + list popup with dismiss (no entity needed).
      - type: notifications
        name: Alerts          # optional, default Alerts
      # Energy: today so far (change since local midnight, from statistics); long press = hourly usage bars.
      - type: energy
        usage: sensor.energy_used_today     # a running total also works
        solar: sensor.energy_solar_today    # either key may be left out
      # Sensor: an attribute instead of the state, up to 2 more on a details line, unit and decimals.
      - entity: sensor.living_room_climate
        name: Living room
        # size: 2x1          # sensor only: name left, value right; shows the details line
        attribute: temperature
        details: [humidity, dew_point]
        unit: "°C"
        decimals: 1
      # History graph on the tab: hours 1..720 (default 24), type auto | line | bar | step,
      # statistic mean | min | max | sum | change and period auto | hour | day (bars only),
      # min / max fix the y axis (min < max), source auto | history | statistics.
      - entity: sensor.living_room_climate
        display: graph
        history:
          hours: 24
          min: 15
          max: 30
      - entity: sensor.energy_today
        display: graph
        history:
          hours: 168
          type: bar
          statistic: sum
          period: day
          source: statistics
      # `history: 48` is the shorthand for hours only; `history: false` turns the long-press history off.
      - entity: sensor.outside_temperature
        history: 48
