# Task 065: build the project website (site/) and deploy it to GitHub Pages.
# One-time: Settings > Pages > Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/ui/png/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Latest release version (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "INKHAUS_VERSION=${tag}" >> "${GITHUB_ENV}"

      - name: Build site
        run: python3 site/build.py

      - name: Check links and weight
        run: python3 site/check.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
